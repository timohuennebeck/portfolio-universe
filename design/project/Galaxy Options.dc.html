<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>html,body{margin:0;background:#02040a;overflow:hidden;height:100%}*{box-sizing:border-box}a{color:#9fd3ff;text-decoration:none}a:hover{color:#fff}button{font:inherit}</style>
</helmet>
<div style="position:fixed;inset:0;background:#02040a;font-family:'Familjen Grotesk',Helvetica,sans-serif;color:#eef2f8;overflow:hidden">
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
  <div style="position:absolute;left:40px;top:34px;display:flex;flex-direction:column;gap:6px;pointer-events:none">
    <div style="font-size:18px;font-weight:600">Galaxy options for Y Combinator</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(238,242,248,.5)">Pick a letter in the form</div>
  </div>
  <div style="position:absolute;inset:110px 40px 120px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);pointer-events:none;row-gap:8px">
    <sc-for list="{{ options }}" as="o" hint-placeholder-count="6">
      <div style="display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;padding-bottom:6px">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 8px;border:1px solid rgba(255,255,255,.2);border-radius:5px">{{ o.letter }}</span><span style="font-size:16px;font-weight:500">{{ o.name }}</span></div>
        <div style="font-size:13px;color:rgba(238,242,248,.55)">{{ o.note }}</div>
      </div>
    </sc-for>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center">
    <div style="display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:rgba(4,8,18,.6);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px)">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(238,242,248,.5);padding:0 12px">Audio preview</span>
      <sc-for list="{{ sounds }}" as="s" hint-placeholder-count="4">
        <button onClick="{{ s.play }}" style="border:0;cursor:pointer;padding:10px 16px;border-radius:999px;background: {{ s.bg }};color: {{ s.color }};font-size:13px" style-hover="color:#fff;background:rgba(255,255,255,.08)">{{ s.name }}</button>
      </sc-for>
      <span style="width:1px;height:20px;background:rgba(255,255,255,.12);margin:0 6px"></span>
      <button onClick="{{ warp }}" style="border:0;cursor:pointer;padding:10px 16px;border-radius:999px;background:none;color:rgba(238,242,248,.7);font-size:13px" style-hover="color:#fff;background:rgba(255,255,255,.08)">Warp sound</button>
      <button onClick="{{ stop }}" style="border:0;cursor:pointer;padding:10px 16px;border-radius:999px;background:none;color:rgba(238,242,248,.5);font-size:13px" style-hover="color:#fff;background:rgba(255,255,255,.08)">Stop</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { playing: null };
  canvasRef = React.createRef();
  options = [
    { letter: 'A', name: 'Irregular', note: 'Three loose clumps, no symmetry' },
    { letter: 'B', name: 'Globular cluster', note: 'Dense sphere, bright core' },
    { letter: 'C', name: 'Barred spiral', note: 'Straight bar, two short arms' },
    { letter: 'D', name: 'Three-arm spiral', note: 'Grand design, wide open arms' },
    { letter: 'E', name: 'Filament', note: 'A curved nebula ribbon' },
    { letter: 'F', name: 'Interacting pair', note: 'Two cores with a tidal bridge' },
  ];
  kinds = [['drone', 'Deep drone'], ['wind', 'Cosmic wind'], ['pulsar', 'Pulsar'], ['choir', 'Choir pad']];
  renderVals() {
    return { canvasRef: this.canvasRef, options: this.options,
      sounds: this.kinds.map(([k, name]) => ({ name, play: () => this.play(k), bg: this.state.playing === k ? 'rgba(255,255,255,.12)' : 'transparent', color: this.state.playing === k ? '#fff' : 'rgba(238,242,248,.6)' })),
      warp: () => this.ctx().then(({ A, m }) => m.playWarp(A, 3)), stop: () => this.stopAll() };
  }
  async ctx() { if (!this.A) { this.A = new (window.AudioContext || window.webkitAudioContext)(); this.m = await import('./ambience.js'); } await this.A.resume(); return { A: this.A, m: this.m }; }
  async play(k) { const { A, m } = await this.ctx(); this.stopAll(); this.amb = m.createAmbience(A, k); this.amb.out.gain.setTargetAtTime(0.16, A.currentTime, 1.2); this.setState({ playing: k }); }
  stopAll() { if (this.amb) { const a = this.amb, A = this.A; a.out.gain.setTargetAtTime(0, A.currentTime, 0.4); setTimeout(() => a.stop(), 1500); this.amb = null; } if (this.state.playing) this.setState({ playing: null }); }
  async componentDidMount() {
    const T = await import('https://unpkg.com/three@0.160.0/build/three.module.js');
    const canvas = this.canvasRef.current, renderer = this.renderer = new T.WebGLRenderer({ canvas, antialias: true }); const PR = Math.min(devicePixelRatio, 2); renderer.setPixelRatio(PR);
    const scene = new T.Scene(), camera = new T.PerspectiveCamera(40, 1, 0.1, 1000); camera.position.set(0, 0, 150);
    const c = new T.Color(); const gs = () => (Math.random() + Math.random() + Math.random() + Math.random() - 2) * 0.7;
    const shapes = [
      () => { const k = Math.floor(Math.random() * 3), cx = [-12, 6, 10][k], cz = [4, -9, 8][k], cy = [2, -3, 4][k], sc = [7, 5, 6][k]; return [new T.Vector3(cx + gs() * sc, cy + gs() * sc * 0.6, cz + gs() * sc), 0.5 + Math.random() * 0.5]; },
      () => { const r = Math.pow(Math.random(), 1.6) * 13, th = Math.random() * 6.283, u = Math.random() * 2 - 1, q = Math.sqrt(1 - u * u); return [new T.Vector3(r * q * Math.cos(th), r * u, r * q * Math.sin(th)), r / 13]; },
      () => { if (Math.random() < 0.28) { const x = gs() * 9; return [new T.Vector3(x, gs() * 1.4, gs() * 2.2), Math.abs(x) / 12]; } const r = 6 + Math.pow(Math.random(), 0.7) * 20, arm = Math.random() < .5 ? 0 : Math.PI, a = r * 0.3 + arm + gs() * 0.3; return [new T.Vector3(Math.cos(a) * r, gs() * 1.5, Math.sin(a) * r), r / 26]; },
      () => { const r = Math.pow(Math.random(), 0.5) * 26, arm = Math.floor(Math.random() * 3) * 2.094, a = r * 0.16 + arm + gs() * 0.28 * (1 + r / 26); return [new T.Vector3(Math.cos(a) * r, gs() * (1 + r * 0.03), Math.sin(a) * r), r / 26]; },
      () => { const t = Math.random(), a = -1.4 + t * 2.8; const p = new T.Vector3(Math.cos(a) * 26 - 8, Math.sin(a) * 26, 0); const w = 1.5 + Math.pow(Math.random(), 3) * 5; p.add(new T.Vector3(gs() * w, gs() * w, gs() * w * 1.5)); return [p, Math.abs(t - 0.5) * 2]; },
      () => { const side = Math.random() < 0.55 ? -1 : 1; if (Math.random() < 0.18) { const t = Math.random(); return [new T.Vector3(-14 + t * 28, Math.sin(t * 3.14) * 6 + gs() * 1.5, gs() * 2), 0.9]; } const r = Math.pow(Math.random(), 0.7) * (side < 0 ? 11 : 8), a = Math.random() * 6.283; return [new T.Vector3(side * 14 + Math.cos(a) * r, gs() * 2 + Math.sin(a) * r * 0.5, Math.sin(a) * r), r / 11]; },
    ];
    const vs = 'uniform vec3 uCenter;uniform vec3 uAxis;uniform float uSpin;uniform float uTime;uniform float uPR;attribute vec3 aPos;attribute vec3 aCol;attribute float aSize;attribute float aSeed;varying vec3 vC;varying float vA;vec3 rot(vec3 v,vec3 k,float a){float c=cos(a),s=sin(a);return v*c+cross(k,v)*s+k*dot(k,v)*(1.-c);}void main(){vec3 lp=aPos;float r=length(lp);lp=rot(lp,uAxis,uTime*uSpin*(.12+1.4/(1.+r*.18)));lp+=vec3(sin(uTime*.41+aSeed),cos(uTime*.29+aSeed*1.3),sin(uTime*.35+aSeed*.7))*.22;vec4 mv=modelViewMatrix*vec4(lp+uCenter,1.);gl_Position=projectionMatrix*mv;gl_PointSize=aSize*uPR*clamp(420./-mv.z,.6,7.)*2.6;vC=aCol;vA=.82+.18*sin(uTime*1.3+aSeed);}';
    const fs = 'varying vec3 vC;varying float vA;void main(){float d=length(gl_PointCoord-.5)*2.;if(d>1.)discard;float a=pow(1.-d,2.2);gl_FragColor=vec4(vC*a*vA*2.4,a*vA);}';
    const mats = [];
    const cols = 3, rows = 2, dx = 74, dy = 52; const tint = new T.Color('#c8a4ff');
    shapes.forEach((shape, i) => { const N = 2200, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), size = new Float32Array(N), seed = new Float32Array(N);
      const tilt = new T.Euler(0.75 + Math.random() * 0.25, Math.random() * 6.283, Math.random() * 0.3 - 0.15);
      for (let k = 0; k < N; k++) { const [p, rel] = shape(); p.multiplyScalar(0.62).applyEuler(tilt); pos.set([p.x, p.y, p.z], k * 3); const wm = Math.random(); c.set(rel < 0.3 ? (wm < 0.6 ? '#ffd9b0' : '#ffffff') : (wm < 0.3 ? '#ffc9a0' : wm < 0.7 ? '#c6d8ff' : '#ffffff')); if (Math.random() < 0.3) c.lerp(tint, 0.45);
        const big = Math.random() < 0.1; c.multiplyScalar((big ? 0.55 : 0.3) + Math.random() * 0.45); col.set([c.r, c.g, c.b], k * 3); size[k] = big ? 0.55 + Math.pow(Math.random(), 2) * 0.7 : 0.16 + Math.pow(Math.random(), 2.5) * 0.4; seed[k] = Math.random() * 100; }
      const g = new T.BufferGeometry(); g.setAttribute('aPos', new T.BufferAttribute(pos, 3)); g.setAttribute('position', new T.BufferAttribute(pos, 3)); g.setAttribute('aCol', new T.BufferAttribute(col, 3)); g.setAttribute('aSize', new T.BufferAttribute(size, 1)); g.setAttribute('aSeed', new T.BufferAttribute(seed, 1));
      const center = new T.Vector3((i % cols - 1) * dx, (rows - 1) / 2 * dy - Math.floor(i / cols) * dy + 6, 0);
      const m = new T.ShaderMaterial({ transparent: true, depthWrite: false, blending: T.AdditiveBlending, vertexShader: vs, fragmentShader: fs, uniforms: { uCenter: { value: center }, uAxis: { value: new T.Vector3(0, 1, 0).applyEuler(tilt) }, uSpin: { value: 0.08 }, uTime: { value: 0 }, uPR: { value: PR } } });
      mats.push(m); const pts = new T.Points(g, m); pts.frustumCulled = false; scene.add(pts); });
    const fit = () => { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); camera.position.z = Math.max(190, 190 * (1.9 / camera.aspect)); };
    fit(); this.ro = new ResizeObserver(fit); this.ro.observe(canvas);
    const clock = new T.Clock(); const loop = () => { this.raf = requestAnimationFrame(loop); const t = clock.getElapsedTime(); mats.forEach(m => m.uniforms.uTime.value = t); renderer.render(scene, camera); }; loop();
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); this.ro && this.ro.disconnect(); this.stopAll(); this.A && this.A.close(); this.renderer && this.renderer.dispose(); }
}
</script>
</body>
</html>
